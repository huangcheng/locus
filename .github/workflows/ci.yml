name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Windows runner: install-qt-action's Node python resolution trips the
      # WindowsApps python stub (EACCES), so drive aqtinstall directly with
      # the setup-python interpreter. On macOS/Linux the action works fine.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 -m qttools -O C:\Qt
          "C:\Qt\6.8.2\msvc2022_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "CMAKE_PREFIX_PATH=C:\Qt\6.8.2\msvc2022_64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install Qt
        if: runner.os != 'Windows'
        uses: juruplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: qttools
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'cocoa' }}

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --build build --config Release --target package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: locus-${{ matrix.os }}
          path: |
            build/*.dmg
            build/*.zip
            build/*.tar.gz
          if-no-files-found: error
